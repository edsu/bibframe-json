[project]
name = "bibframe-json"
version = "0.1.0"
description = "Read and validate one opinionated JSON expression of a BIBFRAME resource"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "jsonschema>=4.23",
]

[dependency-groups]
dev = [
    # rdflib is the generator's dependency, not the library's: the ontology is
    # read at build time and nothing parses RDF at runtime.
    "rdflib>=7.1.3",
    "pytest>=8.3.4",
    "ruff>=0.9.6",
]

[tool.pytest.ini_options]
addopts = "-v"
testpaths = ["tests"]
markers = [
    "corpus: needs the Blue Core corpus and bluecore-models; deselect with -m 'not corpus'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bibframe_json"]

[tool.hatch.build]
# The generated schema ships with the library; the generator and the ontology
# it reads do not.
include = ["bibframe_json/**", "schema/**"]
