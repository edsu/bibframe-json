[project]
name = "bibframe-json"
version = "0.1.0"
description = "Read and validate one opinionated JSON expression of a BIBFRAME resource"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "jsonschema>=4.23",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    # rdflib is the generator's dependency, not the library's: the ontology is
    # read at build time and nothing parses RDF at runtime.
    "rdflib>=7.1.3",
    "pytest>=8.3.4",
    "ruff>=0.9.6",
    "ty>=0.0.1a1",
]

[tool.pytest.ini_options]
addopts = "-v"
testpaths = ["tests"]
markers = [
    "corpus: needs the Blue Core corpus and bluecore-models; deselect with -m 'not corpus'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bibframe_json"]

# The schemas and the context are the artifacts this package exists to publish,
# so they live inside bibframe_json/ and hatchling ships them with the package.
# They used to sit at the top level, where `packages` excluded them and an
# installed copy had neither -- and no force-include is needed now they are in.

[tool.ruff]
# Leave Markdown alone. `ruff format` reformats Python code blocks inside it,
# which flattens the aligned comments the README's examples rely on to line the
# results up against the calls.
extend-exclude = ["*.md"]
